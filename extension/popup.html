<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>ChatVault</title>
  </head>
  <body>
    <header>
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#475569"/>
              <stop offset="100%" stop-color="#1e293b"/>
            </linearGradient>
            <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#fde68a"/>
              <stop offset="60%" stop-color="#fbbf24"/>
              <stop offset="100%" stop-color="#b45309"/>
            </linearGradient>
          </defs>
          <g transform="rotate(-7 24 9)">
            <rect x="14" y="1" width="20" height="14" rx="1.5" fill="#fef3c7"/>
            <rect x="17" y="5" width="14" height="1.2" rx="0.6" fill="#92400e" opacity="0.55"/>
            <rect x="17" y="8" width="11" height="1.2" rx="0.6" fill="#92400e" opacity="0.55"/>
            <rect x="17" y="11" width="13" height="1.2" rx="0.6" fill="#92400e" opacity="0.55"/>
          </g>
          <rect x="3" y="13" width="42" height="33" rx="5" fill="url(#body)"/>
          <rect x="13" y="13" width="22" height="3.5" rx="1" fill="#0f172a"/>
          <rect x="8" y="19" width="32" height="22" rx="2.5" fill="#334155" stroke="#0f172a" stroke-width="0.6"/>
          <rect x="9" y="22.5" width="2" height="3" rx="0.5" fill="#0f172a"/>
          <rect x="9" y="34.5" width="2" height="3" rx="0.5" fill="#0f172a"/>
          <rect x="13" y="28.5" width="6" height="3" rx="1.2" fill="#92400e"/>
          <circle cx="30" cy="30" r="6" fill="#0f172a"/>
          <circle cx="30" cy="30" r="4.2" fill="url(#brass)"/>
          <circle cx="30" cy="30" r="1.1" fill="#92400e"/>
          <rect x="29.5" y="22.5" width="1" height="1.6" rx="0.4" fill="#fbbf24"/>
        </svg>
      </div>
      <div class="brand-text">
        <strong>ChatVault</strong>
        <small>local-first export</small>
      </div>
    </header>

    <main>
      <p class="lede" id="lede">
        Export the current ChatGPT or Claude conversation to PDF, Markdown, or JSON. We'll open ChatVault with the conversation pre-loaded.
      </p>
      <button id="export-btn" type="button">
        <span class="btn-label">Export this conversation</span>
        <span class="btn-spinner" aria-hidden="true"></span>
      </button>
      <p id="status" class="status" role="status"></p>
    </main>

    <footer>
      <a href="https://chatvault.space" target="_blank" rel="noreferrer">Open ChatVault</a>
      <span class="dot">·</span>
      <a href="https://github.com/johnivanov04/ChatVault" target="_blank" rel="noreferrer">Source</a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
