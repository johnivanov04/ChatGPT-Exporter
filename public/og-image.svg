<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0118"/>
      <stop offset="50%" stop-color="#1a0436"/>
      <stop offset="100%" stop-color="#0a0118"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#863bff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#863bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e14ff"/>
    </linearGradient>
    <linearGradient id="dial" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7e14ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Vault logo, scaled up -->
  <g transform="translate(120 130) scale(6.2)">
    <!-- Document being deposited -->
    <g transform="rotate(-7 24 9)">
      <rect x="14" y="1" width="20" height="14" rx="1.5" fill="#f5f3ff"/>
      <rect x="17" y="5" width="14" height="1.2" rx="0.6" fill="#c4b5fd"/>
      <rect x="17" y="8" width="11" height="1.2" rx="0.6" fill="#c4b5fd"/>
      <rect x="17" y="11" width="13" height="1.2" rx="0.6" fill="#c4b5fd"/>
    </g>
    <rect x="3" y="13" width="42" height="33" rx="5" fill="url(#body)"/>
    <rect x="13" y="13" width="22" height="3.5" rx="1" fill="#2a0764"/>
    <rect x="8" y="19" width="32" height="22" rx="2.5" fill="#5a1ec7" stroke="#2a0764" stroke-width="0.6"/>
    <rect x="9" y="22.5" width="2" height="3" rx="0.5" fill="#2a0764"/>
    <rect x="9" y="34.5" width="2" height="3" rx="0.5" fill="#2a0764"/>
    <rect x="13" y="28.5" width="6" height="3" rx="1.2" fill="#2a0764"/>
    <circle cx="30" cy="30" r="6" fill="#2a0764"/>
    <circle cx="30" cy="30" r="4.2" fill="url(#dial)"/>
    <circle cx="30" cy="30" r="1.1" fill="#2a0764"/>
    <rect x="29.5" y="22.5" width="1" height="1.6" rx="0.4" fill="#2a0764"/>
    <rect x="7" y="46" width="4" height="2" rx="0.5" fill="#5a1ec7"/>
    <rect x="37" y="46" width="4" height="2" rx="0.5" fill="#5a1ec7"/>
  </g>

  <text x="490" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="108" font-weight="800" fill="#ffffff" letter-spacing="-3">ChatVault</text>
  <text x="490" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="500" fill="#c4b5fd">Local-first AI chat exporter</text>

  <g transform="translate(490 425)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="600">
    <rect x="0" y="0" width="130" height="44" rx="22" fill="#1e1b3b" stroke="#3b3370" stroke-width="1"/>
    <text x="65" y="29" fill="#e9d5ff" text-anchor="middle">ChatGPT</text>

    <rect x="146" y="0" width="115" height="44" rx="22" fill="#1e1b3b" stroke="#3b3370" stroke-width="1"/>
    <text x="203" y="29" fill="#e9d5ff" text-anchor="middle">Claude</text>

    <rect x="277" y="0" width="115" height="44" rx="22" fill="#1e1b3b" stroke="#3b3370" stroke-width="1"/>
    <text x="334" y="29" fill="#e9d5ff" text-anchor="middle">Gemini</text>
  </g>

  <text x="490" y="525" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="500" fill="#9d8cd1">PDF · Markdown · JSON · with attachments</text>

  <text x="1150" y="595" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="600" fill="#7c6aa8" text-anchor="end">chatvault.space</text>
</svg>
