<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Vault logo, scaled up -->
  <g transform="translate(120 130) scale(6.2)">
    <g transform="rotate(-7 24 9)">
      <rect x="14" y="1" width="20" height="14" rx="1.5" fill="#fef3c7"/>
      <rect x="17" y="5" width="14" height="1.2" rx="0.6" fill="#92400e" opacity="0.55"/>
      <rect x="17" y="8" width="11" height="1.2" rx="0.6" fill="#92400e" opacity="0.55"/>
      <rect x="17" y="11" width="13" height="1.2" rx="0.6" fill="#92400e" opacity="0.55"/>
    </g>
    <rect x="3" y="13" width="42" height="33" rx="5" fill="url(#body)"/>
    <rect x="13" y="13" width="22" height="3.5" rx="1" fill="#0f172a"/>
    <rect x="8" y="19" width="32" height="22" rx="2.5" fill="#334155" stroke="#0f172a" stroke-width="0.6"/>
    <rect x="9" y="22.5" width="2" height="3" rx="0.5" fill="#0f172a"/>
    <rect x="9" y="34.5" width="2" height="3" rx="0.5" fill="#0f172a"/>
    <rect x="13" y="28.5" width="6" height="3" rx="1.2" fill="#92400e"/>
    <rect x="13.5" y="29" width="5" height="1" rx="0.5" fill="#fbbf24" opacity="0.7"/>
    <circle cx="30" cy="30" r="6" fill="#0f172a"/>
    <circle cx="30" cy="30" r="4.2" fill="url(#brass)"/>
    <circle cx="30" cy="30" r="1.1" fill="#92400e"/>
    <rect x="29.5" y="22.5" width="1" height="1.6" rx="0.4" fill="#fbbf24"/>
    <rect x="7" y="46" width="4" height="2" rx="0.5" fill="#334155"/>
    <rect x="37" y="46" width="4" height="2" rx="0.5" fill="#334155"/>
  </g>

  <text x="490" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="108" font-weight="800" fill="#ffffff" letter-spacing="-3">ChatVault</text>
  <text x="490" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="500" fill="#fde68a">Local-first AI chat exporter</text>

  <g transform="translate(490 425)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="600">
    <rect x="0" y="0" width="130" height="44" rx="22" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="65" y="29" fill="#fef3c7" text-anchor="middle">ChatGPT</text>

    <rect x="146" y="0" width="115" height="44" rx="22" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="203" y="29" fill="#fef3c7" text-anchor="middle">Claude</text>

    <rect x="277" y="0" width="115" height="44" rx="22" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="334" y="29" fill="#fef3c7" text-anchor="middle">Gemini</text>
  </g>

  <text x="490" y="525" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">PDF · Markdown · JSON · with attachments</text>

  <text x="1150" y="595" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="600" fill="#64748b" text-anchor="end">chatvault.space</text>
</svg>
